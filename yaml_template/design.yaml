version: <string> | "0.0.0"
vars:
  <key>: <value> | required
graph:
  id: <string> | required
  description: <text> | None
  log_level: <enum:LogLevel> | [DEBUG, INFO, WARNING, ERROR, CRITICAL]
  is_majority_voting: <bool> | false
  nodes:
  - id: <string> | required
    type: <string> | [agent, human, subgraph, python, passthrough, literal, loop_counter,
      loop_timer]
    description: <string> | None
    context_window: <int> | 0
    log_output: <bool> | true
    config:
      <variant[config]=agent>:
        name: <string> | required
        role: <text> | None
        provider: <string> | [openai, gemini]
        base_url: <string> | "${BASE_URL}"
        api_key: <string> | "${API_KEY}"
        params:
          <key>: <value> | required
        tooling:
        - type: <string> | [function, mcp_remote, mcp_local]
          prefix: <string> | None
          config:
            <variant[config]=function>:
              tools:
              - name: <string> | [code_executor:All, deep_research:All, file:All,
                  user:All, utils:All, uv_related:All, video:All, weather:All, web:All,
                  execute_code, report_continue_chapter, report_create_chapter, report_del_chapter,
                  report_export_pdf, report_outline, report_read, report_read_chapter,
                  report_reorder_chapters, report_rewrite_chapter, search_high_light_key,
                  search_load_all, search_load_by_url, search_save_result, apply_text_edits,
                  copy_path, create_folder, delete_path, describe_available_files,
                  list_directory, load_file, move_path, read_file_segment, read_text_file_snippet,
                  rename_path, save_file, search_in_files, call_user, get_current_time,
                  wait, init_python_env, install_python_packages, uv_run, concat_videos,
                  render_manim, get_city_num, get_weather, read_webpage_content, web_search]
              timeout: <float> | None
            <variant[config]=mcp_remote>:
              server: <string> | required
              headers:
                <key>: <value> | required
              timeout: <float> | None
              cache_ttl: <float> | None
              tool_sources:
              - <string> | None
            <variant[config]=mcp_local>:
              command: <string> | required
              args:
              - <string> | None
              cwd: <string> | None
              env:
                <key>: <value> | required
              inherit_env: <bool> | true
              startup_timeout: <float> | 10.0
              wait_for_log: <string> | None
              cache_ttl: <float> | None
        thinking:
          type: <string> | [reflection]
          config:
            <variant[config]=reflection>:
              reflection_prompt: <string> | required
        memories:
        - name: <string> | required
          retrieve_stage:
          - <AgentExecFlowStage> | [pre_gen_thinking, gen, post_gen_thinking, finished]
          top_k: <int> | 3
          similarity_threshold: <float> | -1.0
          read: <bool> | true
          write: <bool> | true
        skills:
          enabled: <bool> | false
          allow:
          - name: <string> | [greeting-demo, python-scratchpad, rest-api-caller]
        retry:
          enabled: <bool> | true
          max_attempts: <int> | 5
          min_wait_seconds: <float> | 1.0
          max_wait_seconds: <float> | 6.0
          retry_on_status_codes:
          - <int> | None
          retry_on_exception_types:
          - <string> | None
          non_retry_exception_types:
          - <string> | None
          retry_on_error_substrings:
          - <string> | None
      <variant[config]=human>:
        description: <text> | None
      <variant[config]=subgraph>:
        type: <string> | [config, file]
        config:
          <variant[config]=config>:
            id: <string> | required
            description: <string> | None
            log_level: <enum:LogLevel> | [DEBUG, INFO, WARNING, ERROR, CRITICAL]
            is_majority_voting: <bool> | false
            nodes:
            - '<recursive[Node] path: DesignConfig → GraphDefinition → Node → SubgraphConfig → SubgraphInlineConfig → Node>': See
                earlier definition to avoid infinite recursion
            edges:
            - from: <string> | required
              to: <string> | required
              trigger: <bool> | true
              condition:
                type: <string> | [function, keyword]
                config:
                  <variant[config]=function>:
                    name: <string> | [true, always_false, code_fail, code_pass, contains_keyword,
                      length_greater_than_5, need_reflection_loop, not_contains_keyword,
                      should_stop_loop]
                  <variant[config]=keyword>:
                    any:
                    - <string> | None
                    none:
                    - <string> | None
                    regex:
                    - <string> | None
                    case_sensitive: <bool> | true
              carry_data: <bool> | true
              keep_message: <bool> | false
              clear_context: <bool> | false
              clear_kept_context: <bool> | false
              process:
                type: <string> | [regex_extract, function]
                config:
                  <variant[config]=regex_extract>:
                    pattern: <string> | required
                    group: <string> | None
                    case_sensitive: <bool> | true
                    multiline: <bool> | false
                    dotall: <bool> | false
                    multiple: <bool> | false
                    template: <string> | None
                    on_no_match: <enum> | [pass, default, drop]
                    default_value: <string> | None
                  <variant[config]=function>:
                    name: <string> | [code_save_and_run, uppercase_payload]
              dynamic:
                type: <string> | [map, tree]
                split:
                  type: <string> | [message, regex, json_path]
                  config:
                    <variant[config]=message>: {}
                    <variant[config]=regex>:
                      pattern: <string> | required
                      group: <string> | None
                      case_sensitive: <bool> | true
                      multiline: <bool> | false
                      dotall: <bool> | false
                      on_no_match: <enum> | [pass, empty]
                    <variant[config]=json_path>:
                      json_path: <string> | required
                config:
                  <variant[config]=map>:
                    max_parallel: <int> | 10
                  <variant[config]=tree>:
                    group_size: <int> | 3
                    max_parallel: <int> | 10
            memory:
            - name: <string> | required
              type: <string> | [simple, file, blackboard, mem0]
              config:
                <variant[config]=simple>:
                  memory_path: <string> | None
                  embedding:
                    provider: <string> | "openai"
                    model: <string> | "text-embedding-3-small"
                    api_key: <string> | "${API_KEY}"
                    base_url: <string> | "${BASE_URL}"
                    params:
                      <key>: <value> | required
                <variant[config]=file>:
                  index_path: <string> | None
                  file_sources:
                  - path: <string> | required
                    file_types:
                    - <string> | None
                    recursive: <bool> | true
                    encoding: <string> | "utf-8"
                  embedding:
                    provider: <string> | "openai"
                    model: <string> | "text-embedding-3-small"
                    api_key: <string> | "${API_KEY}"
                    base_url: <string> | "${BASE_URL}"
                    params:
                      <key>: <value> | required
                <variant[config]=blackboard>:
                  memory_path: <string> | "auto"
                  max_items: <int> | 1000
                <variant[config]=mem0>:
                  api_key: <string> | "${MEM0_API_KEY}"
                  org_id: <string> | None
                  project_id: <string> | None
                  user_id: <string> | None
                  agent_id: <string> | None
            vars:
              <key>: <value> | required
            organization: <string> | None
            initial_instruction: <string> | None
            start: <string | list[str]> | None
            end: <string | list[str]> | None
          <variant[config]=file>:
            path: <string> | required
      <variant[config]=python>:
        interpreter: <string> | "/home/guilinux/AASMA/ChatDev/ChatDev/venv/bin/python"
        args:
        - <string> | None
        script_path: <string> | None
        env:
          <key>: <value> | required
        timeout_seconds: <int> | 60
        encoding: <string> | "utf-8"
      <variant[config]=passthrough>:
        only_last_message: <bool> | true
      <variant[config]=literal>:
        content: <text> | required
        role: <string> | [user, assistant]
      <variant[config]=loop_counter>:
        max_iterations: <int> | 10
        reset_on_emit: <bool> | true
        message: <text> | None
      <variant[config]=loop_timer>:
        max_duration: <float> | 60.0
        duration_unit: <string> | [seconds, minutes, hours]
        reset_on_emit: <bool> | true
        message: <text> | None
        passthrough: <bool> | false
  edges:
  - from: <string> | required
    to: <string> | required
    trigger: <bool> | true
    condition:
      type: <string> | [function, keyword]
      config:
        <variant[config]=function>:
          name: <string> | [true, always_false, code_fail, code_pass, contains_keyword,
            length_greater_than_5, need_reflection_loop, not_contains_keyword, should_stop_loop]
        <variant[config]=keyword>:
          any:
          - <string> | None
          none:
          - <string> | None
          regex:
          - <string> | None
          case_sensitive: <bool> | true
    carry_data: <bool> | true
    keep_message: <bool> | false
    clear_context: <bool> | false
    clear_kept_context: <bool> | false
    process:
      type: <string> | [regex_extract, function]
      config:
        <variant[config]=regex_extract>:
          pattern: <string> | required
          group: <string> | None
          case_sensitive: <bool> | true
          multiline: <bool> | false
          dotall: <bool> | false
          multiple: <bool> | false
          template: <string> | None
          on_no_match: <enum> | [pass, default, drop]
          default_value: <string> | None
        <variant[config]=function>:
          name: <string> | [code_save_and_run, uppercase_payload]
    dynamic:
      type: <string> | [map, tree]
      split:
        type: <string> | [message, regex, json_path]
        config:
          <variant[config]=message>: {}
          <variant[config]=regex>:
            pattern: <string> | required
            group: <string> | None
            case_sensitive: <bool> | true
            multiline: <bool> | false
            dotall: <bool> | false
            on_no_match: <enum> | [pass, empty]
          <variant[config]=json_path>:
            json_path: <string> | required
      config:
        <variant[config]=map>:
          max_parallel: <int> | 10
        <variant[config]=tree>:
          group_size: <int> | 3
          max_parallel: <int> | 10
  memory:
  - name: <string> | required
    type: <string> | [simple, file, blackboard, mem0]
    config:
      <variant[config]=simple>:
        memory_path: <string> | None
        embedding:
          provider: <string> | "openai"
          model: <string> | "text-embedding-3-small"
          api_key: <string> | "${API_KEY}"
          base_url: <string> | "${BASE_URL}"
          params:
            <key>: <value> | required
      <variant[config]=file>:
        index_path: <string> | None
        file_sources:
        - path: <string> | required
          file_types:
          - <string> | None
          recursive: <bool> | true
          encoding: <string> | "utf-8"
        embedding:
          provider: <string> | "openai"
          model: <string> | "text-embedding-3-small"
          api_key: <string> | "${API_KEY}"
          base_url: <string> | "${BASE_URL}"
          params:
            <key>: <value> | required
      <variant[config]=blackboard>:
        memory_path: <string> | "auto"
        max_items: <int> | 1000
      <variant[config]=mem0>:
        api_key: <string> | "${MEM0_API_KEY}"
        org_id: <string> | None
        project_id: <string> | None
        user_id: <string> | None
        agent_id: <string> | None
  initial_instruction: <text> | None
  start:
  - <string> | None
  end:
  - <string> | None
