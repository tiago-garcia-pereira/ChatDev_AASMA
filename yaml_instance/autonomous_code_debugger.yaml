version: 0.4.0
vars: {}
graph:
  id: autonomous_code_debugger
  description: Lightweight autonomous code debugger with 3 fixers, 3 specialized judges, Borda consensus, and final winner code output.
  log_level: DEBUG
  is_majority_voting: false
  memory: []
  initial_instruction: |
    Provide only path_project/PROJECT_PATH when possible. The workflow will try to run it and reproduce the bug automatically.
    Optional format:
    PROJECT_PATH: /absolute/path/to/project
    TEST_COMMAND: python -m pytest
    <traceback or bug report>
  start:
    - Input Context
  end:
    - Final Report
  nodes:
    - id: Input Context
      type: python
      description: Converts the launch prompt into explicit debugger context.
      context_window: -1
      config:
        script_path: debugger_agents/run_input_context.py
        timeout_seconds: 60
    - id: Auto Reproducer
      type: python
      description: Runs the inferred failing command from path_project/PROJECT_PATH.
      context_window: -1
      config:
        script_path: debugger_agents/run_auto_reproducer.py
        timeout_seconds: 90
    - id: Static Analyzer
      type: python
      description: Runs deterministic static analysis before solution generation.
      context_window: -1
      config:
        script_path: debugger_agents/run_static_analyzer.py
        timeout_seconds: 120
    - id: Conservative Fixer
      type: agent
      description: Minimal exact-line solution strategy.
      context_window: -1
      config:
        name: qwen2.5-coder:3b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 1000
        tooling:
          - type: function
            config:
              tools:
                - name: file:All
              timeout: null
        role: |
          You are Conservative Fixer.
          Strategy: produce the smallest behavior-preserving patch that makes the current diagnostics pass.
          Treat each reported issue as a concrete defect to repair with direct local edits.
          Prefer typo fixes, API corrections, variable-name corrections, and narrow expression changes.
          Avoid guards, refactors, broader validation, formatting-only changes, new abstractions, new helper functions, or speculative improvements unless they are strictly necessary to fix a reported issue.

          Use only the real target file content and the provided workflow outputs.
          Inspect all available diagnostics:
          - Auto Reproducer output, including traceback, stdout, stderr, exit_code, and command.
          - Static Analyzer output, including ast_errors, compile_errors, ruff, mypy, and any tool diagnostics.
          - User-provided bug report or context.

          Your solution must address every real issue reported by Auto Reproducer and Static Analyzer for the target file, unless you explicitly classify a diagnostic as a false positive in diagnosis.
          Do not stop after fixing only the first traceback if static analysis reports additional defects.
          If multiple diagnostics are related, fix them together only as far as needed.
          Do not invent files, APIs, tests, dependencies, variables, or unrelated examples.
          Do not rewrite unrelated code.
          Preserve the original program intent and local style.
          For a literal IndexError on a literal list, do not choose an arbitrary valid index. Prefer the closest valid index that preserves the apparent intended position, for example index 3 -> index 2 for a list with 3 elements.
          Output requirements are mandatory:
          1) Return only JSON inside a ```json block.
          2) Include keys: fixer_id, strategy, diagnosis, files_changed, solution_files, confidence.
          3) solution_files must be a list of objects with keys: path and code.
          4) code must be the final full file content (copyable), never git diff format.
          5) diagnosis must list: reproduced_errors_addressed, static_analysis_issues_addressed, diagnostics_classified_false_positive, remaining_risks.
          If you cannot produce a valid solution, return solution_files=[] and explain why in diagnosis.
          Return only JSON inside a ```json block with:
          fixer_id="conservative", strategy, diagnosis, files_changed, solution_files, confidence.
    - id: Defensive Fixer
      type: agent
      description: Guards and edge-case solution strategy.
      context_window: -1
      config:
        name: qwen2.5-coder:3b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 1000
        tooling:
          - type: function
            config:
              tools:
                - name: file:All
              timeout: null
        role: |
          You are Defensive Fixer.
          Strategy: produce a focused patch that fixes all reported issues and hardens the code against plausible invalid or edge-case inputs near the failure path.
          Prefer direct fixes for obvious typos and incorrect API usage, but add small validation, fallback handling, or clearer error behavior when the input shape is uncertain.
          Avoid hiding defects, swallowing exceptions, or changing expected output silently.
          Keep the fix focused on the failing path and diagnostics.

          Use only the real target file content and the provided workflow outputs.
          Inspect all available diagnostics:
          - Auto Reproducer output, including traceback, stdout, stderr, exit_code, and command.
          - Static Analyzer output, including ast_errors, compile_errors, ruff, mypy, and any tool diagnostics.
          - User-provided bug report or context.

          Your solution must address every real issue reported by Auto Reproducer and Static Analyzer for the target file, unless you explicitly classify a diagnostic as a false positive in diagnosis.
          Do not stop after fixing only the first traceback if static analysis reports additional defects.
          Use small guards, validation, or explicit edge-case handling when the failing code depends on uncertain runtime input.
          Do not add defensive code merely to hide errors.
          Do not silently swallow exceptions.
          For deterministic literal data or obvious typos, prefer the direct correction and explain why a guard is unnecessary.
          Avoid changing public behavior beyond making the program correct and safer.
          Do not invent files, APIs, tests, dependencies, variables, or unrelated examples.
          Do not rewrite unrelated code.
          Preserve the original program intent and local style.
          Output requirements are mandatory:
          1) Return only JSON inside a ```json block.
          2) Include keys: fixer_id, strategy, diagnosis, files_changed, solution_files, confidence.
          3) solution_files must be a list of objects with keys: path and code.
          4) code must be the final full file content (copyable), never git diff format.
          5) diagnosis must list: reproduced_errors_addressed, static_analysis_issues_addressed, diagnostics_classified_false_positive, remaining_risks.
          If you cannot produce a valid solution, return solution_files=[] and explain why in diagnosis.
          Return only JSON inside a ```json block with:
          fixer_id="defensive", strategy, diagnosis, files_changed, solution_files, confidence.
    - id: Root Cause Fixer
      type: agent
      description: Upstream root-cause solution strategy.
      context_window: -1
      config:
        name: qwen2.5-coder:3b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 1000
        tooling:
          - type: function
            config:
              tools:
                - name: file:All
              timeout: null
        role: |
          You are Root-Cause Fixer.
          Strategy: produce a coherent patch that fixes all reported issues by restoring the intended data flow and program invariants.
          Look beyond the immediate crashing line to identify naming mismatches, invalid assumptions, broken state transitions, and type/data-shape inconsistencies.
          A small structural change is allowed when it makes the underlying invariant correct and prevents the same class of bug from reappearing.
          Avoid unrelated redesigns, broad validation, or cosmetic cleanup.

          Use only the real target file content and the provided workflow outputs.
          Inspect all available diagnostics:
          - Auto Reproducer output, including traceback, stdout, stderr, exit_code, and command.
          - Static Analyzer output, including ast_errors, compile_errors, ruff, mypy, and any tool diagnostics.
          - User-provided bug report or context.

          Your solution must address every real issue reported by Auto Reproducer and Static Analyzer for the target file, unless you explicitly classify a diagnostic as a false positive in diagnosis.
          Do not stop after fixing only the first traceback if static analysis reports additional defects.
          Prefer a fix that makes the surrounding logic coherent after all diagnostics are considered.
          Do not add broad validation if the root problem is a simple typo or incorrect API usage.
          Do not invent files, APIs, tests, dependencies, variables, or unrelated examples.
          Do not rewrite unrelated code.
          Preserve the original program intent and local style.
          For a literal IndexError on a literal list, consider whether the root cause is an off-by-one index. If so, prefer the closest valid index that preserves the apparent intended position instead of choosing an arbitrary valid element.
          Output requirements are mandatory:
          1) Return only JSON inside a ```json block.
          2) Include keys: fixer_id, strategy, diagnosis, files_changed, solution_files, confidence.
          3) solution_files must be a list of objects with keys: path and code.
          4) code must be the final full file content (copyable), never git diff format.
          5) diagnosis must list: reproduced_errors_addressed, static_analysis_issues_addressed, diagnostics_classified_false_positive, remaining_risks.
          If you cannot produce a valid solution, return solution_files=[] and explain why in diagnosis.
          Return only JSON inside a ```json block with:
          fixer_id="root_cause", strategy, diagnosis, files_changed, solution_files, confidence.
    - id: Correctness Judge
      type: agent
      description: Ranks the 3 fixer solutions by correctness.
      context_window: -1
      config:
        name: qwen2.5-coder:3b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 500
        role: |
          You are Correctness Judge.
          Read the real file content, reproduced error, static analysis, and the three solution proposals.
          Rank proposal IDs from best to worst by likely functional correctness.
          Prefer solutions that directly fix the reproduced error, preserve intended behavior, and are consistent with the real code.
          Defensive guards are valid candidates, but for deterministic literal data with an obvious direct correction, rank a behavior-preserving direct fix above a guard that merely avoids the crash or changes the output.
          Penalize arbitrary valid indices, such as changing index 3 to index 1 without evidence.
          Penalize solutions that do not address the traceback, introduce new failures, invent APIs/files, or omit required code.
          The ranking must contain all and only the fixer proposal IDs, for example ["conservative","defensive","root_cause"]. selected must equal ranking[0].
          Return only JSON inside a ```json block:
          {"voter_id":"correctness_judge","ranking":["..."],"selected":"...","rationale":"..."}
    - id: Minimality Judge
      type: agent
      description: Ranks the 3 fixer solutions by minimality and maintainability.
      context_window: -1
      config:
        name: qwen2.5-coder:3b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 500
        role: |
          You are Minimality Judge.
          Read the real file content, reproduced error, static analysis, and the three solution proposals.
          Rank proposal IDs from best to worst by how small, focused, and maintainable the change is.
          Prefer solutions that change only what is necessary, preserve local style, and avoid broad rewrites.
          Defensive guards are valid candidates, but for deterministic literal data with an obvious direct correction, rank the direct one-expression fix above an if/else guard.
          Penalize arbitrary valid indices that change which element is used without evidence.
          Penalize unrelated refactors, excessive guards, duplicated code, invented examples, and changes that obscure the original intent.
          The ranking must contain all and only the fixer proposal IDs, for example ["conservative","defensive","root_cause"]. selected must equal ranking[0].
          Return only JSON inside a ```json block:
          {"voter_id":"minimality_judge","ranking":["..."],"selected":"...","rationale":"..."}
    - id: Risk Judge
      type: agent
      description: Ranks the 3 fixer solutions by regression and safety risk.
      context_window: -1
      config:
        name: qwen2.5-coder:3b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 500
        role: |
          You are Risk Judge.
          Read the real file content, reproduced error, static analysis, and the three solution proposals.
          Rank proposal IDs from best to worst by lowest regression risk.
          Prefer solutions that are robust for edge cases, avoid hiding failures, and do not broaden behavior unexpectedly.
          Defensive guards are valid candidates and may win when inputs are dynamic or uncertain. For deterministic literal data with an obvious direct correction, do not rank a guard first solely because it avoids the crash.
          Penalize silent exception swallowing, over-permissive validation, global side effects, security issues, and changes that may break callers.
          The ranking must contain all and only the fixer proposal IDs, for example ["conservative","defensive","root_cause"]. selected must equal ranking[0].
          Return only JSON inside a ```json block:
          {"voter_id":"risk_judge","ranking":["..."],"selected":"...","rationale":"..."}
    - id: Borda Consensus
      type: python
      description: Selects the winner solution with Borda count.
      context_window: -1
      config:
        script_path: debugger_agents/run_consensus.py
        timeout_seconds: 60
    - id: Patch Presenter
      type: python
      description: Formats the three patch proposals for human review.
      context_window: -1
      config:
        script_path: debugger_agents/run_patch_presenter.py
        timeout_seconds: 30
    - id: Human Patch Selector
      type: human
      description: Type 1, 2, or 3 to select which patch to apply, or REJECT to skip.
      context_window: -1
      config:
        description: |
          Type 1, 2, or 3 to select which patch to apply, or REJECT to skip.

    - id: Patch Applier
      type: python
      description: Applies the user-selected solution files to the target project.
      context_window: -1
      config:
        script_path: debugger_agents/run_patch_applier.py
        timeout_seconds: 120
    - id: Final Report
      type: agent
      config:
        name: qwen2.5-coder:3b
        provider: openai
        role: |
          You are Final Debugging Report Writer.
          Use only the provided workflow outputs. Do not invent, merge, normalize, or rewrite fixer proposals.
          Prefer the normalized fields inside the consensus_result JSON over earlier raw messages.

          Produce a concise final report with these sections:
          1) Original failure: summarize only from the reproduced error/context.
          2) Fixer proposals: use consensus_result.proposals. List each fixer_id separately. For each one, copy its own strategy, diagnosis, files_changed, confidence, and solution_files exactly as provided in that proposal. Never replace a fixer's solution_files with another fixer's code or with the consensus winner.
          3) Judge rankings: use consensus_result.votes. List the ranking from each voter_id exactly as provided.
          4) Borda consensus: report winner_id, scores, and ranked order from the consensus_result.
          5) Winner solution: provide only the winner.solution_files or winner.solution_code from consensus_result.winner in copyable code format.
           6) Patch application status: use the patch_applier_result, if present, to say whether the patch applier succeeded.
             Consider it successful when errors is empty and applied_files is not empty.
             If it failed, state the errors and do not claim that the patch was applied.

          If a value is missing from the workflow outputs, write "not provided" instead of guessing.
          If two proposals look identical, still report them separately only if their original solution_files are identical.
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 1000
        tooling: []
        thinking: null
        memories: []
        skills: null
        retry: null
      description: Produces a final report and the winner solution in copyable code format.
      context_window: -1
      log_output: true
