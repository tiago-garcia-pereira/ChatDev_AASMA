version: 0.4.0
vars: {}
graph:
  id: autonomous_code_debugger
  description: Lightweight autonomous code debugger with 3 fixers, 1 judge, Borda consensus, and final winner code output.
  log_level: DEBUG
  is_majority_voting: false
  memory: []
  initial_instruction: |
    Provide only path_project/PROJECT_PATH when possible. The workflow will try to run it and reproduce the bug automatically.
    Optional format:
    PROJECT_PATH: /absolute/path/to/project
    TEST_COMMAND: python -m pytest
    <traceback or bug report>
  start:
    - Input Context
  end:
    - Final Report
  nodes:
    - id: Input Context
      type: python
      description: Converts the launch prompt into explicit debugger context.
      context_window: -1
      config:
        script_path: debugger_agents/run_input_context.py
        timeout_seconds: 60

    - id: Auto Reproducer
      type: python
      description: Runs the inferred failing command from path_project/PROJECT_PATH.
      context_window: -1
      config:
        script_path: debugger_agents/run_auto_reproducer.py
        timeout_seconds: 90

    - id: Static Analyzer
      type: python
      description: Runs deterministic static analysis before solution generation.
      context_window: -1
      config:
        script_path: debugger_agents/run_static_analyzer.py
        timeout_seconds: 120

    - id: Conservative Fixer
      type: agent
      description: Minimal exact-line solution strategy.
      context_window: -1
      config: &fixer_model
        name: qwen2.5-coder:3b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 700
        tooling:
          - type: function
            config:
              tools:
                - name: file:All
              timeout: null
        role: |
          You are Conservative Fixer.
          Strategy: change only the exact line or smallest local expression that causes the crash.
          Use only the real file content and traceback/context provided in the input. Do not invent functions, variables, files, or unrelated examples.
          Output requirements are mandatory:
          1) Return only JSON inside a ```json block.
          2) Include keys: fixer_id, strategy, diagnosis, files_changed, solution_files, confidence.
          3) solution_files must be a list of objects with keys: path and code.
          4) code must be the final file content (copyable), never git diff format.
          If you cannot produce a valid solution, return solution_files=[] and explain why in diagnosis.
          Return only JSON inside a ```json block with:
          fixer_id="conservative", strategy, diagnosis, files_changed, solution_files, confidence.

    - id: Defensive Fixer
      type: agent
      description: Guards and edge-case solution strategy.
      context_window: -1
      config:
        <<: *fixer_model
        role: |
          You are Defensive Fixer.
          Strategy: fix the bug with a small guard, validation, or explicit edge-case handling only when that is better than changing one expression.
          Use only the real file content and traceback/context provided in the input. Do not invent functions, variables, files, or unrelated examples.
          Output requirements are mandatory:
          1) Return only JSON inside a ```json block.
          2) Include keys: fixer_id, strategy, diagnosis, files_changed, solution_files, confidence.
          3) solution_files must be a list of objects with keys: path and code.
          4) code must be the final file content (copyable), never git diff format.
          If you cannot produce a valid solution, return solution_files=[] and explain why in diagnosis.
          Return only JSON inside a ```json block with:
          fixer_id="defensive", strategy, diagnosis, files_changed, solution_files, confidence.

    - id: Root Cause Fixer
      type: agent
      description: Upstream root-cause solution strategy.
      context_window: -1
      config:
        <<: *fixer_model
        role: |
          You are Root-Cause Fixer.
          Strategy: find and fix the upstream cause that created the invalid state, not just the crash site.
          Use only the real file content and traceback/context provided in the input. Do not invent functions, variables, files, or unrelated examples.
          Output requirements are mandatory:
          1) Return only JSON inside a ```json block.
          2) Include keys: fixer_id, strategy, diagnosis, files_changed, solution_files, confidence.
          3) solution_files must be a list of objects with keys: path and code.
          4) code must be the final file content (copyable), never git diff format.
          If you cannot produce a valid solution, return solution_files=[] and explain why in diagnosis.
          Return only JSON inside a ```json block with:
          fixer_id="root_cause", strategy, diagnosis, files_changed, solution_files, confidence.

    - id: Solution Judge
      type: agent
      description: Single judge that ranks the 3 fixer solutions.
      context_window: -1
      config:
        name: qwen2.5-coder:3b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 500
        role: |
          You are Solution Judge.
          Read the real file content, reproduced error, static analysis, and the three solution proposals.
          Rank proposal IDs from best to worst. Prefer solutions that are correct, minimal, and directly fix the reproduced error.
          Penalize invented code, unrelated examples, missing code blocks, and inconsistent outputs.
          Return only JSON inside a ```json block:
          {"voter_id":"judge","ranking":["..."],"selected":"...","rationale":"..."}

    - id: Borda Consensus
      type: python
      description: Selects the winner solution with Borda count.
      context_window: -1
      config:
        script_path: debugger_agents/run_consensus.py
        timeout_seconds: 60

    - id: Final Report
      type: agent
      description: Produces only the winner solution in copyable code format.
      context_window: -1
      config:
        name: qwen2.5-coder:3b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 700
        role: |
          You are Final Debugging Report Writer.
          Summarize the original failure, the three fixer proposals, the judge ranking, borda consensus, and provide the winner solution in copyable code format.
          Do not invent results; use only the provided workflow outputs.


  edges:
    - from: Input Context
      to: Auto Reproducer
      trigger: true
      condition: &always {type: function, config: {name: 'true'}}
      carry_data: true
      keep_message: true
    - from: Input Context
      to: Static Analyzer
      trigger: true
      condition: *always
      carry_data: true
      keep_message: true
    - from: Auto Reproducer
