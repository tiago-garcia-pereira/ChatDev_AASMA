version: 0.4.0
vars: {}
graph:
  id: autonomous_code_debugger
  description: Lightweight autonomous code debugger with 3 fixers, 1 judge, Borda consensus, validation, and patch application.
  log_level: DEBUG
  is_majority_voting: false
  memory: []
  initial_instruction: |
    Provide only path_project/PROJECT_PATH when possible. The workflow will try to run it and reproduce the bug automatically.
    Optional format:
    PROJECT_PATH: /absolute/path/to/project
    TEST_COMMAND: python -m pytest
    <traceback or bug report>
  start:
    - Input Context
  end:
    - Final Report
  nodes:
    - id: Input Context
      type: python
      description: Converts the launch prompt into explicit debugger context.
      context_window: -1
      config:
        script_path: debugger_agents/run_input_context.py
        timeout_seconds: 60

    - id: Auto Reproducer
      type: python
      description: Runs the inferred failing command from path_project/PROJECT_PATH.
      context_window: -1
      config:
        script_path: debugger_agents/run_auto_reproducer.py
        timeout_seconds: 90

    - id: Static Analyzer
      type: python
      description: Runs deterministic static analysis before patch generation.
      context_window: -1
      config:
        script_path: debugger_agents/run_static_analyzer.py
        timeout_seconds: 120

    - id: Conservative Fixer
      type: agent
      description: Minimal exact-line patch strategy.
      context_window: -1
      config: &fixer_model
        name: qwen2.5-coder:7b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 700
        tooling:
          - type: function
            config:
              tools:
                - name: file:All
              timeout: null
        role: |
          You are Conservative Fixer.
          Strategy: change only the exact line or smallest local expression that causes the crash.
          Use only the real file content and traceback/context provided in the input. Do not invent functions, variables, files, or unrelated examples.
          The unified_diff must be a complete git-style diff with file headers, e.g. "diff --git a/path b/path", "--- a/path", "+++ b/path".
          Return only JSON inside a ```json block with:
          fixer_id="conservative", strategy, diagnosis, files_changed, unified_diff, confidence.

    - id: Defensive Fixer
      type: agent
      description: Guards and edge-case patch strategy.
      context_window: -1
      config:
        <<: *fixer_model
        role: |
          You are Defensive Fixer.
          Strategy: fix the bug with a small guard, validation, or explicit edge-case handling only when that is better than changing one expression.
          Use only the real file content and traceback/context provided in the input. Do not invent functions, variables, files, or unrelated examples.
          The unified_diff must be a complete git-style diff with file headers, e.g. "diff --git a/path b/path", "--- a/path", "+++ b/path".
          Return only JSON inside a ```json block with:
          fixer_id="defensive", strategy, diagnosis, files_changed, unified_diff, confidence.

    - id: Root Cause Fixer
      type: agent
      description: Upstream root-cause patch strategy.
      context_window: -1
      config:
        <<: *fixer_model
        role: |
          You are Root-Cause Fixer.
          Strategy: find and patch the upstream cause that created the invalid state, not just the crash site.
          Use only the real file content and traceback/context provided in the input. Do not invent functions, variables, files, or unrelated examples.
          The unified_diff must be a complete git-style diff with file headers, e.g. "diff --git a/path b/path", "--- a/path", "+++ b/path".
          Return only JSON inside a ```json block with:
          fixer_id="root_cause", strategy, diagnosis, files_changed, unified_diff, confidence.

    - id: Patch Judge
      type: agent
      description: Single judge that ranks the 3 fixer patches.
      context_window: -1
      config:
        name: qwen2.5-coder:7b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 500
        role: |
          You are Patch Judge.
          Read the real file content, reproduced error, static analysis, and the three patch proposals.
          Rank proposal IDs from best to worst. Prefer patches that are correct, minimal, apply cleanly, and directly fix the reproduced error.
          Penalize invented code, unrelated examples, missing diffs, and corrupt patches.
          Return only JSON inside a ```json block:
          {"voter_id":"judge","ranking":["..."],"selected":"...","rationale":"..."}

    - id: Borda Consensus
      type: python
      description: Selects a patch with Borda count after filtering invalid patches.
      context_window: -1
      config:
        script_path: debugger_agents/run_consensus.py
        timeout_seconds: 60

    - id: Validate Borda
      type: python
      description: Applies and tests the Borda winner in a temporary sandbox.
      context_window: -1
      config:
        script_path: debugger_agents/run_validator.py
        timeout_seconds: 180

    - id: Apply Patch
      type: python
      description: Applies the validated Borda winner to the original project path.
      context_window: -1
      config:
        script_path: debugger_agents/run_apply_patch.py
        timeout_seconds: 60

    - id: Final Report
      type: agent
      description: Produces a concise debugging report from the workflow outputs.
      context_window: -1
      config:
        name: qwen2.5-coder:7b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
          max_tokens: 700
        role: |
          You are Final Debugging Report Writer.
          Summarize the original failure, the three fixer proposals, the judge ranking, Borda consensus, validation result, and whether the patch was applied.
          Do not invent results; use only the provided workflow outputs.

  edges:
