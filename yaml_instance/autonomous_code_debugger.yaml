version: 0.4.0
vars: {}
graph:
  id: autonomous_code_debugger
  description: Autonomous multi-agent code debugger with five strategic fixers, debate, Borda consensus, and validation.
  log_level: DEBUG
  is_majority_voting: false
  memory: []
  initial_instruction: |
    Provide only path_project/PROJECT_PATH when possible. The workflow will try to run it and reproduce the bug automatically.
    Optional format:
    PROJECT_PATH: /absolute/path/to/project
    TEST_COMMAND: python -m pytest
    <traceback or bug report>
  start:
    - Input Context
  end:
    - Final Report
  nodes:
    - id: Input Context
      type: python
      description: Converts uploaded Python files and the launch prompt into explicit debugger context.
      context_window: -1
      config:
        script_path: debugger_agents/run_input_context.py
        timeout_seconds: 60

    - id: Auto Reproducer
      type: python
      description: Runs the inferred failing command from path_project/PROJECT_PATH.
      context_window: -1
      config:
        script_path: debugger_agents/run_auto_reproducer.py
        timeout_seconds: 90

    - id: Bug Reproducer
      type: agent
      description: Reproduces or clarifies the failing behavior.
      context_window: 0
      config:
        name: qwen2.5-coder:7b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
        role: |
          You are Bug Reproducer. Inspect the user's bug report, traceback, project path, and failing command.
          If tools are available, inspect files and run the smallest relevant command. Do not edit files.
          Output:
          - reproduction steps
          - observed error
          - suspected failing file/function
          - exact TEST_COMMAND if the user provided one
        tooling:
          - type: function
            config:
              tools:
                - name: file:All
                - name: uv_related:All
              timeout: null

    - id: Static Analyzer
      type: python
      description: Runs deterministic static analysis before patch generation.
      context_window: -1
      config:
        script_path: debugger_agents/run_static_analyzer.py
        timeout_seconds: 120

    - id: Conservative Fixer
      type: agent
      description: Minimal exact-line patch strategy.
      context_window: -1
      config: &fixer_model
        name: qwen2.5-coder:7b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.2
        tooling:
          - type: function
            config:
              tools:
                - name: file:All
              timeout: null
        role: |
          You are Conservative Fixer.
          Strategy: change only the exact line or smallest local expression that causes the crash.
          Prioritize low blast radius and avoid refactors.
          Use only the real file content and traceback/context provided in the input. Do not invent functions, variables, files, or unrelated examples.
          The unified_diff must be a complete git-style diff with file headers, e.g. "diff --git a/path b/path", "--- a/path", "+++ b/path".
          Return only JSON inside a ```json block with:
          fixer_id="conservative", strategy, diagnosis, files_changed, unified_diff, confidence.

    - id: Refactor Fixer
      type: agent
      description: Structural patch strategy.
      context_window: -1
      config:
        <<: *fixer_model
        role: |
          You are Refactor Fixer.
          Strategy: if the bug is a symptom of poor structure, propose a broader but coherent rewrite.
          Preserve behavior where possible, but improve the code shape when it prevents the bug recurring.
          Use only the real file content and traceback/context provided in the input. Do not invent functions, variables, files, or unrelated examples.
          The unified_diff must be a complete git-style diff with file headers, e.g. "diff --git a/path b/path", "--- a/path", "+++ b/path".
          Return only JSON inside a ```json block with:
          fixer_id="refactor", strategy, diagnosis, files_changed, unified_diff, confidence.

    - id: Defensive Fixer
      type: agent
      description: Guards and edge-case patch strategy.
      context_window: -1
      config:
        <<: *fixer_model
        role: |
          You are Defensive Fixer.
          Strategy: fix the bug by adding validations, type checks, guards, and clear handling for edge cases.
          Prefer explicit failure modes over silent corruption.
          Use only the real file content and traceback/context provided in the input. Do not invent functions, variables, files, or unrelated examples.
          The unified_diff must be a complete git-style diff with file headers, e.g. "diff --git a/path b/path", "--- a/path", "+++ b/path".
          Return only JSON inside a ```json block with:
          fixer_id="defensive", strategy, diagnosis, files_changed, unified_diff, confidence.

    - id: Performance Fixer
      type: agent
      description: Efficient patch strategy.
      context_window: -1
      config:
        <<: *fixer_model
        role: |
          You are Performance Fixer.
          Strategy: fix the bug while checking whether the solution can be more efficient in time, memory, or repeated work.
          Avoid premature complexity; only optimize when connected to the bug or a clear hot path.
          Use only the real file content and traceback/context provided in the input. Do not invent functions, variables, files, or unrelated examples.
          The unified_diff must be a complete git-style diff with file headers, e.g. "diff --git a/path b/path", "--- a/path", "+++ b/path".
          Return only JSON inside a ```json block with:
          fixer_id="performance", strategy, diagnosis, files_changed, unified_diff, confidence.

    - id: Root Cause Fixer
      type: agent
      description: Upstream root-cause patch strategy.
      context_window: -1
      config:
        <<: *fixer_model
        role: |
          You are Root-Cause Fixer.
          Strategy: ignore superficial symptoms at first and find the upstream cause that created the invalid state.
          Patch the source of the bad value or control flow, not only the crash site.
          Use only the real file content and traceback/context provided in the input. Do not invent functions, variables, files, or unrelated examples.
          The unified_diff must be a complete git-style diff with file headers, e.g. "diff --git a/path b/path", "--- a/path", "+++ b/path".
          Return only JSON inside a ```json block with:
          fixer_id="root_cause", strategy, diagnosis, files_changed, unified_diff, confidence.

    - id: Conservative Debater
      type: agent
      description: Debate/ranking round from the conservative perspective.
      context_window: -1
      config: &debater_model
        name: qwen2.5-coder:7b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
        role: |
          You are a debate voter in an iterative voting protocol.
          Read all patch proposals. Rank proposal IDs from best to worst for correctness, safety, and testability.
          You may vote against your own proposal if another is better.
          Return only JSON inside a ```json block:
          {"voter_id":"conservative","ranking":["..."],"selected":"...","rationale":"..."}

    - id: Refactor Debater
      type: agent
      description: Debate/ranking round from the refactor perspective.
      context_window: -1
      config:
        <<: *debater_model
        role: |
          You are a debate voter in an iterative voting protocol.
          Prefer patches that fix the underlying structure without adding unnecessary risk.
          Return only JSON inside a ```json block:
          {"voter_id":"refactor","ranking":["..."],"selected":"...","rationale":"..."}

    - id: Defensive Debater
      type: agent
      description: Debate/ranking round from the defensive perspective.
      context_window: -1
      config:
        <<: *debater_model
        role: |
          You are a debate voter in an iterative voting protocol.
          Prefer patches that handle edge cases and invalid inputs clearly.
          Return only JSON inside a ```json block:
          {"voter_id":"defensive","ranking":["..."],"selected":"...","rationale":"..."}

    - id: Performance Debater
      type: agent
      description: Debate/ranking round from the performance perspective.
      context_window: -1
      config:
        <<: *debater_model
        role: |
          You are a debate voter in an iterative voting protocol.
          Prefer patches that fix the bug with efficient, simple execution.
          Return only JSON inside a ```json block:
          {"voter_id":"performance","ranking":["..."],"selected":"...","rationale":"..."}

    - id: Root Cause Debater
      type: agent
      description: Debate/ranking round from the root-cause perspective.
      context_window: -1
      config:
        <<: *debater_model
        role: |
          You are a debate voter in an iterative voting protocol.
          Prefer patches that fix the upstream cause of the failure, not just the symptom.
          Return only JSON inside a ```json block:
          {"voter_id":"root_cause","ranking":["..."],"selected":"...","rationale":"..."}

    - id: Borda Consensus
      type: python
      description: Selects a patch with Borda count.
      context_window: -1
      config:
        script_path: debugger_agents/run_consensus.py
        timeout_seconds: 60

    - id: Validate Borda
      type: python
      description: Applies and tests the Borda winner in a temporary sandbox.
      context_window: -1
      config:
        script_path: debugger_agents/run_validator.py
        timeout_seconds: 180

    - id: Apply Patch
      type: python
      description: Applies the validated Borda winner to the original project path.
      context_window: -1
      config:
        script_path: debugger_agents/run_apply_patch.py
        timeout_seconds: 60

    - id: Final Report
      type: agent
      description: Produces an experiment report from the consensus and validation outputs.
      context_window: -1
      config:
        name: qwen2.5-coder:7b
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params:
          protocol: chat
          temperature: 0.1
        role: |
          You are Final Debugging Report Writer.
          Summarize:
          - the original failure
          - the five strategies and their proposed patches
          - debate rankings
          - the Borda consensus result
          - the validation result for the selected patch
          - whether the patch was applied to the original file
          - what data should be logged for the project report
          Do not invent results; use only the provided workflow outputs.

